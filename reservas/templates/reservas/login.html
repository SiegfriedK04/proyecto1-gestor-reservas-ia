{% extends "base.html" %}

{% block title %}Ingresar | Gestor de reservas{% endblock %}

{% block content %}
<section class="card form-card compact">
    <div class="form-intro">
        <p class="eyebrow">Bienvenido</p>
        <h1>Ingresa a tu cuenta</h1>
        <p>Administra tus reservas, preferencias y listas de espera.</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <div class="field">
            <label for="username">Nombre de usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit"><i data-lucide="log-in"></i> Ingresar</button>
    </form>
    <p class="auth-note">¿Todavía no tienes cuenta? <a href="{% url 'register' %}">Créala aquí</a>.</p>
</section>
{% endblock %}
